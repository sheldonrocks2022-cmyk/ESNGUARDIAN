name: Node Guardian CI

on:
  push:
    branches: [main, node-hosting]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
