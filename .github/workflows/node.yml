name: Node Guardian CI (legacy)

on:
  workflow_dispatch:
  push:
    branches: [node-hosting]
  pull_request:
    branches: [node-hosting]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
