name: Node Guardian checks

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  node-guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Validate Discord slash-command builders
        run: node -e "const c=require('./src/commands'); const defs=c.asJson(); if(!defs.length) process.exit(1); console.log('Validated', defs.length, 'root commands')"
