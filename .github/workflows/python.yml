name: Python Guardian CI

on:
  push:
    branches: [main]
    paths:
      - "esn_guardian/**"
      - "main.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "esn_guardian/**"
      - "main.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Guardian and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Compile all Python modules
        run: python -m compileall -q main.py esn_guardian tests
      - name: Run Guardian test suite
        run: PYTHONPATH=. python -m pytest -q
