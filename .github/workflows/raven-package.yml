name: Raven Host package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "esn_guardian/**"
      - "main.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - ".env.example"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/raven-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exact GitHub-style Raven ZIP
        shell: bash
        run: |
          rm -rf ESNGUARDIAN-main ESNGUARDIAN-main.zip
          mkdir ESNGUARDIAN-main
          rsync -a             --exclude '.git'             --exclude 'ESNGUARDIAN-main'             --exclude 'ESNGUARDIAN-main.zip'             ./ ESNGUARDIAN-main/
          zip -qr ESNGUARDIAN-main.zip ESNGUARDIAN-main

      - name: Upload exact Raven ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ESNGUARDIAN-main
          path: ESNGUARDIAN-main.zip
          if-no-files-found: error
          retention-days: 7
