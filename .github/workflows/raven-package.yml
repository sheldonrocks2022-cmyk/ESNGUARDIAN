name: CogitHost Node package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - ".env.example"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/raven-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CogitHost upload ZIP
        shell: bash
        run: |
          rm -rf ESN-GUARDIAN-NODE ESN-GUARDIAN-NODE.zip
          mkdir -p ESN-GUARDIAN-NODE
          cp -r src ESN-GUARDIAN-NODE/src
          cp package.json .env.example README.md .gitignore ESN-GUARDIAN-NODE/
          cd ESN-GUARDIAN-NODE
          zip -qr ../ESN-GUARDIAN-NODE.zip .
      - name: Upload CogitHost ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ESN-GUARDIAN-NODE
          path: ESN-GUARDIAN-NODE.zip
          if-no-files-found: error
          retention-days: 7
